[input.keyboard]
layout = "br"           # empty uses the system default
variant = "abnt2"
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = false
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true
left_handed = false
# accel_profile = "adaptive"
# sensitivity = 0.5
# scroll_factor = 1.5
# disable_while_typing = true
# disable_on_external_mouse = true
# click_method = "clickfinger"
# tap_button_map = "left_middle_right"

[input.focus]
follows_mouse = true

[input.cursor]
theme = "Bibata-Modern-Classic"
size = 20
# hardware_cursor = true
follows_focus = true
hide_when_typing = false
hide_timeout_ms = 0